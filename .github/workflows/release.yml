name: Release

on:
  push:
    branches:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.2)'
        required: true
        default: 'v0.2.2'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    name: Build Frontend & Backend JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy Frontend Assets to Backend Static Directory
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/* backend/src/main/resources/static/

      - name: Build Backend Standalone JAR
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/workpulse-backend-*.jar

  build-windows:
    name: Build Windows Zero-Dependency Installer
    needs: build-backend
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil cryptography python-dotenv pystray pillow pywin32

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Download Backend JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Generate High-Resolution Application Icons
        run: |
          python -c "from PIL import Image, ImageDraw; from pathlib import Path; p = Path('assets'); p.mkdir(parents=True, exist_ok=True); img = Image.new('RGBA', (256, 256), (15, 23, 42, 255)); draw = ImageDraw.Draw(img); draw.rounded_rectangle([10, 10, 246, 246], radius=50, outline=(56, 189, 248, 220), width=8); raw_pts = [(140, 40), (72, 132), (124, 132), (100, 216), (192, 112), (136, 112), (164, 40)]; draw.polygon(raw_pts, fill=(56, 189, 248, 255)); img.save(p / 'icon.ico', format='ICO', sizes=[(16,16), (24,24), (32,32), (48,48), (64,64), (128,128), (256,256)]); img.save(p / 'icon.png', format='PNG')"

      - name: Build WorkPulse Standalone Executable
        run: |
          pyinstaller --onefile --noconsole --name WorkPulse --icon assets/icon.ico --distpath dist/bin --add-data "backend/target/*.jar;backend/target" run.py

      - name: Generate Minimal Private Windows JRE via jlink
        run: |
          if (Test-Path "dist\jre") { Remove-Item -Recurse -Force "dist\jre" }
          if (-not (Test-Path "dist")) { New-Item -ItemType Directory "dist" }
          jlink --no-header-files --no-man-pages --strip-debug `
            --add-modules java.base,java.compiler,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.sql.rowset,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.httpserver,jdk.unsupported,jdk.management `
            --output dist/jre

      - name: Package Windows Installables
        run: python scripts/package.py ${{ github.event.inputs.version || github.ref_name }} windows-x64

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*-Setup.exe
            dist/*.zip

  build-linux:
    name: Build Linux Native Packages (.deb & .tar.gz)
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux Build Dependencies & PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils
          python -m pip install --upgrade pip
          pip install pyinstaller psutil cryptography python-dotenv pystray pillow

      - name: Download Backend JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Generate High-Resolution Application Icons
        run: |
          python -c "from PIL import Image, ImageDraw; from pathlib import Path; p = Path('assets'); p.mkdir(parents=True, exist_ok=True); img = Image.new('RGBA', (256, 256), (15, 23, 42, 255)); draw = ImageDraw.Draw(img); draw.rounded_rectangle([10, 10, 246, 246], radius=50, outline=(56, 189, 248, 220), width=8); raw_pts = [(140, 40), (72, 132), (124, 132), (100, 216), (192, 112), (136, 112), (164, 40)]; draw.polygon(raw_pts, fill=(56, 189, 248, 255)); img.save(p / 'icon.png', format='PNG')"

      - name: Build WorkPulse Standalone Linux Binary
        run: |
          pyinstaller --onefile --noconsole --name WorkPulse --distpath dist/bin --add-data "backend/target/*.jar:backend/target" run.py

      - name: Generate Minimal Private Linux JRE via jlink
        run: |
          rm -rf dist/jre
          mkdir -p dist
          jlink --no-header-files --no-man-pages --strip-debug \
            --add-modules java.base,java.compiler,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.sql.rowset,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.httpserver,jdk.unsupported,jdk.management \
            --output dist/jre

      - name: Package Linux Packages (.deb & .tar.gz)
        run: python scripts/package_linux.py ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.deb
            dist/*.tar.gz

  build-macos:
    name: Build macOS Native Bundle & Disk Image (.dmg)
    needs: build-backend
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install macOS Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil cryptography python-dotenv pystray pillow pyobjc-framework-Cocoa

      - name: Download Backend JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Generate High-Resolution Application Icons
        run: |
          python -c "from PIL import Image, ImageDraw; from pathlib import Path; p = Path('assets'); p.mkdir(parents=True, exist_ok=True); img = Image.new('RGBA', (512, 512), (15, 23, 42, 255)); draw = ImageDraw.Draw(img); draw.rounded_rectangle([20, 20, 492, 492], radius=100, outline=(56, 189, 248, 220), width=16); raw_pts = [(280, 80), (144, 264), (248, 264), (200, 432), (384, 224), (272, 224), (328, 80)]; draw.polygon(raw_pts, fill=(56, 189, 248, 255)); img.save(p / 'icon.png', format='PNG')"

      - name: Build WorkPulse Standalone macOS Binary
        run: |
          pyinstaller --onefile --noconsole --name WorkPulse --distpath dist/bin --add-data "backend/target/*.jar:backend/target" run.py

      - name: Generate Minimal Private macOS JRE via jlink
        run: |
          rm -rf dist/jre
          mkdir -p dist
          jlink --no-header-files --no-man-pages --strip-debug \
            --add-modules java.base,java.compiler,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.sql.rowset,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.httpserver,jdk.unsupported,jdk.management \
            --output dist/jre

      - name: Package macOS App Bundle & Disk Image (.dmg)
        run: python scripts/package_macos.py ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.dmg
            dist/*.tar.gz

  publish-release:
    name: Collate & Publish Zero-Dependency Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: dist

      - name: Consolidate & Generate Cryptographic SHA-256 Checksums
        run: python scripts/generate_checksums.py

      - name: Clean Obsolete Assets from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/clean_release_assets.py "${{ github.repository }}" "${{ github.event.inputs.version || github.ref_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: WorkPulse ${{ github.event.inputs.version || github.ref_name }}
          files: |
            dist/*-Setup.exe
            dist/*.zip
            dist/*.deb
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Java Spring Boot Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Backend with Maven
        working-directory: backend
        run: mvn clean test

  frontend-build:
    name: React Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  collector-test:
    name: Python OS Collector Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock psutil cryptography python-dotenv pystray pillow

      - name: Install Windows specific dependencies
        if: runner.os == 'Windows'
        run: pip install pywin32

      - name: Install Linux specific dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool xprintidle python3-tk xvfb libayatana-appindicator3-1 gir1.2-ayatanaappindicator3-0.1

      - name: Run Collector & System Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/ -v
        env:
          PYSTRAY_BACKEND: dummy

      - name: Run Collector & System Tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m pytest tests/ -v
server:
  port: 9876
  address: 127.0.0.1

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: workpulse-backend
  datasource:
    url: jdbc:sqlite:data/workpulse.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.workpulse: INFO

workpulse:
  version: "0.2.2"
  update:
    github-repo: "maurihimanshu/WorkPulse"
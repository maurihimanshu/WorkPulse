server:
  port: 9876

spring:
  application:
    name: workpulse-backend
  datasource:
    url: jdbc:sqlite:data/workpulse.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.workpulse: INFO